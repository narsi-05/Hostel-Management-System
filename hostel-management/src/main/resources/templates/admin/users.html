<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Manage Users - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">🏠 Hostel<span>Find</span></a>
    <div class="nav-links">
        <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a>
        <a class="nav-link active" th:href="@{/admin/users}">Users</a>
        <a class="nav-link" th:href="@{/admin/hostels}">Hostels</a>
        <a class="nav-link btn-nav" th:href="@{/logout}">Logout</a>
    </div>
</nav>

<div class="page-wrapper">
    <div class="page-header d-flex justify-between align-center">
        <div>
            <h1>Manage Users</h1>
            <p>View, block, or remove registered users</p>
        </div>
        <div class="d-flex gap-1">
            <a th:href="@{/admin/users}"             class="btn btn-outline btn-sm">All</a>
            <a th:href="@{/admin/users(type='OWNER')}"   class="btn btn-outline btn-sm">Owners</a>
            <a th:href="@{/admin/users(type='VISITOR')}" class="btn btn-outline btn-sm">Visitors</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>#</th><th>Name</th><th>Email</th><th>Phone</th>
                    <th>Type</th><th>Status</th><th>Joined</th><th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u, i : ${users}">
                    <td th:text="${i.count}"></td>
                    <td><strong th:text="${u.fullName}"></strong></td>
                    <td th:text="${u.email}"></td>
                    <td th:text="${u.phoneNumber}"></td>
                    <td>
                        <span class="badge badge-info"    th:if="${u.userType.name() == 'OWNER'}">Owner</span>
                        <span class="badge badge-success" th:if="${u.userType.name() == 'VISITOR'}">Visitor</span>
                    </td>
                    <td>
                        <span class="badge badge-success" th:if="${u.status.name() == 'ACTIVE'}">Active</span>
                        <span class="badge badge-danger"  th:unless="${u.status.name() == 'ACTIVE'}">Blocked</span>
                    </td>
                    <td th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}"></td>
                    <td>
                        <div class="d-flex gap-1">
                            <form th:if="${u.status.name() == 'ACTIVE'}"
                                  th:action="@{'/admin/users/' + ${u.id} + '/block'}" method="post">
                                <button class="btn btn-danger btn-sm" type="submit">Block</button>
                            </form>
                            <form th:unless="${u.status.name() == 'ACTIVE'}"
                                  th:action="@{'/admin/users/' + ${u.id} + '/unblock'}" method="post">
                                <button class="btn btn-success btn-sm" type="submit">Unblock</button>
                            </form>
                            <form th:action="@{'/admin/users/' + ${u.id} + '/delete'}" method="post"
                                  onsubmit="return confirm('Delete this user?')">
                                <button class="btn btn-danger btn-sm" type="submit">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="8" class="text-center">No users found.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<footer><p>© 2024 HostelFind Admin Panel</p></footer>
</body>
</html>
