<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${hostel.hostelName} + ' - HostelFind'">Hostel Detail</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .photo-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.75rem;margin-bottom:1.5rem}
        .gallery-img{width:100%;height:160px;object-fit:cover;border-radius:10px}
        .detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:1.5rem}
        @media(max-width:768px){.detail-grid{grid-template-columns:1fr}}
        .info-row{display:flex;gap:.5rem;padding:.65rem 0;border-bottom:1px solid #e2e8f0;font-size:.92rem}
        .info-label{font-weight:600;color:#64748b;min-width:140px}
        .review-card{background:#f8fafc;border-radius:10px;padding:1rem;margin-bottom:.75rem}
    </style>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">🏠 Hostel<span>Find</span></a>
    <div class="nav-links">
        <a class="nav-link" th:href="@{/}">Home</a>
        <a class="nav-link" th:href="@{/search}">Search</a>
        <span sec:authorize="isAnonymous()">
            <a class="nav-link" th:href="@{/login}">Login</a>
            <a class="nav-link btn-nav" th:href="@{/register}">Register</a>
        </span>
        <span sec:authorize="isAuthenticated()">
            <a class="nav-link btn-nav" th:href="@{/logout}">Logout</a>
        </span>
    </div>
</nav>
<div class="page-wrapper">
    <div th:if="${hostel.photos != null and !hostel.photos.isEmpty()}" class="photo-gallery">
        <img th:each="p : ${hostel.photoArray}" class="gallery-img"
             th:src="@{'/uploads/' + ${p}}" th:alt="${hostel.hostelName}"/>
    </div>
    <div th:unless="${hostel.photos != null and !hostel.photos.isEmpty()}"
         class="hostel-img-placeholder" style="height:250px;border-radius:12px;margin-bottom:1.5rem;font-size:4rem">🏠</div>

    <div class="detail-grid">
        <div>
            <div class="card mb-3">
                <div class="card-body">
                    <h1 style="font-size:1.8rem;margin-bottom:.5rem" th:text="${hostel.hostelName}"></h1>
                    <div class="d-flex align-center gap-2 mb-2">
                        <span class="badge badge-info" th:text="${hostel.hostelType.displayName}"></span>
                        <span class="badge badge-success" th:text="${hostel.availability.displayName}"></span>
                        <span class="star-rating">⭐ <span th:text="${#numbers.formatDecimal(hostel.averageRating,1,1)}"></span>
                            (<span th:text="${hostel.totalReviews}"></span>)
                        </span>
                    </div>
                    <div class="info-row"><span class="info-label">📍 Location</span><span th:text="${hostel.location}"></span></div>
                    <div class="info-row" th:if="${hostel.city != null}"><span class="info-label">🏙️ City</span><span th:text="${hostel.city}"></span></div>
                    <div class="info-row"><span class="info-label">🏠 Sharing Type</span><span th:text="${hostel.sharingType.displayName}"></span></div>
                    <div class="info-row"><span class="info-label">💰 Amount/Month</span><strong style="color:#1a3c5e;font-size:1.1rem">₹<span th:text="${hostel.amountPerMonth}"></span></strong></div>
                    <div class="info-row"><span class="info-label">📞 Contact</span><span th:text="${hostel.phoneNumber}"></span></div>
                    <div th:if="${hostel.description}" class="mt-3">
                        <h3>About</h3>
                        <p style="margin-top:.5rem" th:text="${hostel.description}"></p>
                    </div>
                </div>
            </div>
            <!-- Reviews -->
            <div class="card">
                <div class="card-body">
                    <h3 style="margin-bottom:1rem">⭐ Reviews</h3>
                    <div th:if="${not #lists.isEmpty(reviews)}">
                        <div class="review-card" th:each="r : ${reviews}">
                            <div class="d-flex justify-between align-center">
                                <strong th:text="${r.visitor.fullName}"></strong>
                                <span class="star-rating"><span th:each="i : ${#numbers.sequence(1,r.rating)}">⭐</span></span>
                            </div>
                            <p style="font-size:.9rem;margin-top:.4rem" th:text="${r.comment}"></p>
                            <div style="font-size:.75rem;color:#94a3b8;margin-top:.3rem" th:text="${#temporals.format(r.createdAt,'dd MMM yyyy')}"></div>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(reviews)}" style="color:#94a3b8">No reviews yet.</div>
                </div>
            </div>
        </div>
        <div>
            <div class="card" style="position:sticky;top:80px">
                <div class="card-body text-center">
                    <h3 style="margin-bottom:1rem">📞 Contact</h3>
                    <a th:href="'tel:' + ${hostel.phoneNumber}" class="btn btn-success w-100 mb-2">
                        📞 <span th:text="${hostel.phoneNumber}"></span>
                    </a>
                    <div class="alert alert-info" style="font-size:.85rem">
                        <a th:href="@{/login}">Login</a> or
                        <a th:href="@{/register}">Register</a> to message the owner and save this hostel.
                    </div>
                </div>
            </div>
        </div>
    </div>
    <a th:href="@{/search}" class="btn btn-outline mt-2">← Back to Search</a>
</div>
<footer><p>© 2024 HostelFind</p></footer>
</body>
</html>
