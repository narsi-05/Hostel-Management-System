<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Profile - Owner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">🏠 Hostel<span>Find</span></a>
    <div class="nav-links">
        <a class="nav-link" th:href="@{/owner/dashboard}">Dashboard</a>
        <a class="nav-link btn-nav" th:href="@{/logout}">Logout</a>
    </div>
</nav>
<div class="page-wrapper">
    <div class="form-card" style="max-width:480px">
        <div class="card">
            <div style="background:linear-gradient(135deg,#1a3c5e,#2563a8);padding:2rem;text-align:center;color:#fff">
                <div class="sidebar-avatar" style="margin:0 auto 1rem;width:80px;height:80px;font-size:2rem;background:var(--accent);color:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700" th:text="${user.firstName.charAt(0)}"></div>
                <h2 style="color:#fff" th:text="${user.fullName}"></h2>
                <p style="opacity:.8">Hostel Owner</p>
            </div>
            <div class="card-body">
                <table style="width:100%">
                    <tr style="border-bottom:1px solid #e2e8f0">
                        <td style="padding:.8rem;font-weight:600;color:#64748b">Full Name</td>
                        <td style="padding:.8rem" th:text="${user.fullName}"></td>
                    </tr>
                    <tr style="border-bottom:1px solid #e2e8f0">
                        <td style="padding:.8rem;font-weight:600;color:#64748b">Email</td>
                        <td style="padding:.8rem" th:text="${user.email}"></td>
                    </tr>
                    <tr style="border-bottom:1px solid #e2e8f0">
                        <td style="padding:.8rem;font-weight:600;color:#64748b">Phone</td>
                        <td style="padding:.8rem" th:text="${user.phoneNumber}"></td>
                    </tr>
                    <tr style="border-bottom:1px solid #e2e8f0">
                        <td style="padding:.8rem;font-weight:600;color:#64748b">Role</td>
                        <td style="padding:.8rem"><span class="badge badge-info">Owner</span></td>
                    </tr>
                    <tr>
                        <td style="padding:.8rem;font-weight:600;color:#64748b">Joined</td>
                        <td style="padding:.8rem" th:text="${#temporals.format(user.createdAt,'dd MMM yyyy')}"></td>
                    </tr>
                </table>
                <div class="mt-3">
                    <a th:href="@{/owner/dashboard}" class="btn btn-primary w-100">← Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
<footer><p>© 2024 HostelFind</p></footer>
</body>
</html>
