# ===================================
# HOSTEL MANAGEMENT SYSTEM - CONFIG
# ===================================

# Server Configuration
server.port=8080
server.servlet.context-path=/hostel

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/hostel_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234567890
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# File Storage Path — MUST be an ABSOLUTE path.
# A relative path here resolves against the JVM's current working directory,
# which differs between "Run As Spring Boot App" in STS and a WAR deployed
# inside Tomcat's own bin/webapps folders — causing photos saved by the
# owner to be written to a different folder than the one visitors are served from.
#
# Windows example:  hostel.upload.dir=C:/hostel-uploads/hostel-photos/
# Linux/Mac example: hostel.upload.dir=/var/hostel-uploads/hostel-photos/
hostel.upload.dir=${HOSTEL_UPLOAD_DIR:${user.home}/hostel-uploads/hostel-photos/}

# Logging
logging.level.com.hostel=DEBUG
logging.level.org.springframework.security=INFO

# Application Name
spring.application.name=Hostel Management System
